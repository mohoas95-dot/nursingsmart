<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="آیکون پرستار خانم">
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="216" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0f6"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="scrub" x1="56" y1="148" x2="184" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#7e22ce" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <circle cx="188" cy="55" r="18" fill="none" stroke="#831843" stroke-width="8" opacity=".16"/>
  <path d="M188 73v33m-15-15h30" stroke="#831843" stroke-width="8" stroke-linecap="round" opacity=".16"/>
  <circle cx="43" cy="183" r="42" fill="#ffffff" opacity=".32"/>

  <g filter="url(#shadow)">
    <!-- hair silhouette -->
    <path d="M62 113c0-47 27-78 58-78s58 31 58 78v58H62v-58Z" fill="#7c3f2b"/>

    <!-- uniform -->
    <path d="M44 240c7-59 40-93 76-93s69 34 76 93H44Z" fill="url(#scrub)"/>
    <path d="M86 154 120 206l34-52" fill="none" stroke="#f5f3ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".96"/>
    <path d="M78 163c-13 18-16 42-12 70" fill="none" stroke="#f5f3ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M162 163c13 18 16 42 12 70" fill="none" stroke="#f5f3ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="66" cy="226" r="10" fill="#6d28d9" stroke="#f5f3ff" stroke-width="5"/>
    <circle cx="174" cy="226" r="10" fill="#6d28d9" stroke="#f5f3ff" stroke-width="5"/>

    <!-- face -->
    <circle cx="120" cy="101" r="48" fill="#f6b589"/>
    <path d="M70 89c10-35 31-53 54-53 27 0 47 20 52 54-25-17-57-22-106-1Z" fill="#8b4f37"/>

    <!-- nurse cap -->
    <path d="M87 49h66l-8 31H95L87 49Z" fill="#ffffff" stroke="#f3d6e4" stroke-width="2"/>
    <path d="M120 55v18M111 64h18" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>

    <!-- minimal face -->
    <path d="M94 105c6-4 13-4 19 0M127 105c6-4 13-4 19 0" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M106 131c8 7 20 7 28 0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
