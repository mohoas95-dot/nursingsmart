<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="آیکون رئیس پرستاری">
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="216" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfff8"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="coat" x1="64" y1="126" x2="176" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#047857" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="0" fill="url(#bg)"/>
  <circle cx="198" cy="44" r="30" fill="#fff" opacity=".34"/>
  <circle cx="40" cy="183" r="43" fill="#fff" opacity=".28"/>

  <g filter="url(#shadow)">
    <!-- shoulders and white management coat -->
    <path d="M46 240c7-58 38-93 74-93s67 35 74 93H46Z" fill="url(#coat)"/>
    <path d="M88 153 120 202l32-49" fill="#dff7ef"/>
    <path d="M96 156 120 240l24-84" fill="none" stroke="#cbd9e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M111 181h18l7 59h-32l7-59Z" fill="#0f766e"/>

    <!-- head -->
    <circle cx="120" cy="99" r="48" fill="#f6b589"/>
    <path d="M73 92c5-38 24-60 47-60s42 22 47 60c-14-13-30-19-47-19s-33 6-47 19Z" fill="#e5e7eb"/>
    <path d="M82 79c6-29 21-44 38-44s32 15 38 44c-12-7-25-10-38-10s-26 3-38 10Z" fill="#f8fafc"/>

    <!-- nurse cap + cross -->
    <path d="M89 50h62l-7 31H96L89 50Z" fill="#ffffff" stroke="#d5e3e9" stroke-width="2"/>
    <path d="M120 55v18M111 64h18" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>

    <!-- face / mature moustache hint -->
    <path d="M95 103c6-4 13-4 19 0M126 103c6-4 13-4 19 0" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 125c7-6 14-7 20-1 6-6 13-5 20 1" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M106 137c8 6 20 6 28 0" stroke="#334155" stroke-width="4" stroke-linecap="round" opacity=".42"/>

    <!-- management badge -->
    <circle cx="168" cy="180" r="18" fill="#fbbf24" stroke="#fff7ed" stroke-width="5"/>
    <path d="m168 169 3.3 6.7 7.4 1.1-5.4 5.2 1.3 7.3-6.6-3.5-6.6 3.5 1.3-7.3-5.4-5.2 7.4-1.1 3.3-6.7Z" fill="#ffffff"/>

    <!-- clipboard -->
    <rect x="55" y="174" width="34" height="45" rx="8" fill="#0f766e" opacity=".92"/>
    <rect x="63" y="169" width="18" height="10" rx="3" fill="#ffffff"/>
    <path d="M65 190h14M65 202h14" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
